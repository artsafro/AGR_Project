[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-ai"
version = "0.1.0"
description = "Traceable NPM/VPM synthetic vertical slice"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "pydantic==2.14.1", "Pillow==12.3.0", "pypdf==6.21.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "numpy==2.5.3", "shapely==2.2.0"]
pdf-review = ["PyMuPDF==1.28.2"]
contour-model = ["numpy==2.5.3", "shapely==2.2.0"]

[project.scripts]
dt = "dt_ai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dcc: requires an explicitly supplied Blender executable"]
